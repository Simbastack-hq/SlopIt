<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{postSeoTitle}} — {{blogName}}</title>
    <link rel="canonical" href="{{canonicalUrl}}" />
    <link rel="alternate" type="application/rss+xml" title="{{blogName}}" href="{{feedUrl}}" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    {{{markdownAlternate}}} {{{alternates}}} {{{seoMeta}}} {{{jsonLd}}}
    <link rel="stylesheet" href="{{themeCssHref}}" />
  </head>
  <body>
    <header class="masthead">
      <a class="masthead-name" href="{{blogHomeHref}}">{{blogName}}</a>
      {{{parentSiteLink}}}
    </header>
    <article>
      <header>
        <h1>{{postTitle}}</h1>
        <time datetime="{{postPublishedAt}}">{{postPublishedAtDisplay}}</time>
        {{{translations}}} {{{coverImage}}}
      </header>
      <div class="post-body">{{{toc}}} {{{postBody}}}</div>
      {{{tagList}}} {{{moreFrom}}}
    </article>
    <footer>{{{poweredBy}}}</footer>
  </body>
</html>
